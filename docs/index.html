<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator - Haskell GTK4</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            color: #333;
            line-height: 1.6;
            padding: 40px 20px;
        }
        .container { max-width: 700px; margin: 0 auto; }
        h1 { font-size: 2.5rem; margin-bottom: 8px; }
        .subtitle { color: #666; margin-bottom: 30px; }
        .badges { margin-bottom: 30px; }
        .badges img { vertical-align: middle; margin-right: 10px; }
        .download-btn {
            display: inline-block;
            background: #2ea44f;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
        }
        .download-btn:hover { background: #2c974b; }
        .screenshots { display: flex; gap: 20px; flex-wrap: wrap; margin: 30px 0; }
        .screenshots img { width: 280px; border-radius: 8px; }
        h2 { font-size: 1.3rem; margin: 25px 0 10px; }
        pre {
            background: #f6f8fa;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Calculator</h1>
        <p class="subtitle">A macOS calculator built with Haskell, GTK4, and haskell-gi</p>
        
        <div class="badges">
            <a href="https://github.com/bniladridas/calculator/actions">
                <img src="https://github.com/bniladridas/calculator/actions/workflows/release.yml/badge.svg" alt="Release">
            </a>
            <img src="https://img.shields.io/github/v/release/bniladridas/calculator" alt="Version">
        </div>

        <a href="https://github.com/bniladridas/calculator/releases/latest" class="download-btn">Download</a>

        <div class="screenshots">
            <img src="https://raw.githubusercontent.com/bniladridas/calculator/main/GUI/calculator-main-window.png" alt="Main Window">
            <img src="https://raw.githubusercontent.com/bniladridas/calculator/main/GUI/calculator-about-dialog.png" alt="About Dialog">
        </div>

        <h2>Build</h2>
        <pre>brew install ghc cabal-install gtk4 gobject-introspection
cabal build hello-gtk
cabal run hello-gtk</pre>

        <h2>App Bundle</h2>
        <pre>./scripts/create-bundle.sh
open Calculator.app</pre>
    </div>
</body>
</html>
