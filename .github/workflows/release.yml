name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.2.0)'
        required: true
        default: 'v0.1.2.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.tag }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          brew install ghc cabal-install gtk4 gobject-introspection
          cabal update
      
      - name: Build
        run: cabal build hello-gtk

      - name: Create app bundle
        run: ./scripts/create-bundle.sh

      - name: Create ZIP
        run: zip -r Calculator.zip Calculator.app

      - name: Create Release
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          gh release create "$VERSION" Calculator.zip --title "Calculator $VERSION" --notes "Download the macOS app bundle"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
