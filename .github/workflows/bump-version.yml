---
name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (e.g., 0.1.3.0)'
        required: true

permissions:
  contents: write

jobs:
  bump:
    runs-on: macos-lates

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version
        run: |
          OLD_VERSION=$(grep -E "^version:" hello-gtk.cabal | awk '{print $2}')
          NEW_VERSION="${{ github.event.inputs.version }}"

          sed -i '' "s/version:             $OLD_VERSION/version:             $NEW_VERSION/" hello-gtk.cabal

          echo "Updated version from $OLD_VERSION to $NEW_VERSION"

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add hello-gtk.cabal
          git commit -m "chore: bump version to ${{ github.event.inputs.version }}"

          git tag "v${{ github.event.inputs.version }}"
          git push origin main "v${{ github.event.inputs.version }}"
