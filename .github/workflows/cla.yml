name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.action == 'opened' || github.event.action == 'synchronize')
        uses: contributor-assistant/github-action@v2.5.0
        with:
          path-to-signatures: 'cla-signatures.json'
          path-to-document: 'https://github.com/bniladridas/calculator/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'dependabot[bot],github-actions[bot]'
          bot-user: 'github-actions[bot]'
          minimum-confidence: 0.9