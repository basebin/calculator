---
name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  issues: write
  pull-requests: write

jobs:
  CLAAssistant:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - name: "Check CLA"
        uses: actions/github-script@v8
        with:
          script: |
            const signPhrase = 'I have read the CLA Document and I hereby sign the CLA';
            const marker = '<!-- cla-status -->';
            const trustedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const allowlist = new Set(['dependabot[bot]', 'github-actions[bot]']);

            let pullNumber;
            if (context.eventName === 'pull_request_target') {
              pullNumber = context.payload.pull_request.number;
            } else {
              pullNumber = context.payload.issue.number;
            }

            const { owner, repo } = context.repo;
            const pr = (await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            })).data;

            const author = pr.user.login;
            const trustedAuthor =
              allowlist.has(author) || trustedAssociations.has(pr.author_association);

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullNumber,
              per_page: 100,
            });

            const signed = comments.some((comment) => (
              comment.user?.login === author &&
              comment.body?.trim() === signPhrase
            ));

            const botComment = comments.find((comment) => (
              comment.user?.type === 'Bot' &&
              comment.body?.includes(marker)
            ));

            const body = trustedAuthor || signed
              ? `${marker}

                CLA check passed for @${author}.`
              : `${marker}

                @${author}, please review [CLA.md](https://github.com/${owner}/${repo}/blob/main/CLA.md) and comment exactly:

                \`${signPhrase}\`

                Comment \`recheck\` after signing if you want to rerun this check.`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullNumber,
                body,
              });
            }

            if (!trustedAuthor && !signed) {
              core.setFailed(`CLA not signed by @${author}`);
            }
